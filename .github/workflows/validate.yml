name: Validate

on:
  workflow_call:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.16.5
      - run: terraform fmt -check -recursive
        working-directory: terraform
      - run: terraform init -backend=false -input=false -lockfile=readonly
        working-directory: terraform
      - run: terraform validate
        working-directory: terraform
      - run: terraform test
        working-directory: terraform

  deployment-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: bash -n scripts/deploy-on-instance.sh
      - run: python3 -m unittest discover -s tests -v

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build --platform linux/amd64 -t terraform-demo-app:ci ./app
      - run: bash scripts/verify-container.sh terraform-demo-app:ci
